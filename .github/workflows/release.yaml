name: Publish To Chrome Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Publish without running end to end tests"
        type: boolean
        default: false

jobs:
  build:
    name: Build and Release to Chrome Extension Store
    # The release event takes no tag filter, so the tag is checked here.
    # Prereleases stay off the store, because the upload auto-publishes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Run install
        run: pnpm install --frozen-lockfile

      # The wasm build runs in a container, so Go's caches are bind mounted out
      # of it. Without this every run re-downloads the module graph.
      - name: Cache the Go module and build cache
        uses: actions/cache@v6
        with:
          path: .gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('wasm/go.sum', 'Makefile') }}
          restore-keys: gocache-${{ runner.os }}-

      - name: Run build
        run: make build

      - name: Test the app
        run: make test

      - name: Install Chromium for Playwright
        if: ${{ inputs.skip_e2e != true }}
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end to end tests
        if: ${{ inputs.skip_e2e != true }}
        working-directory: tests/e2e
        # Extensions need a full browser, so the run is headed under a
        # virtual display rather than headless.
        run: xvfb-run -a pnpm e2e

      # A GitLab test skips when gitlab.com rate limits the runner, and writes why
      # to this report, so a skip shows on the run instead of passing silently.
      - name: Report GitLab rate limiting
        if: ${{ always() && inputs.skip_e2e != true }}
        working-directory: tests/e2e
        run: |
          report=test-results/gitlab-rate-limited.txt
          if [ -f "$report" ]; then
            echo "::warning title=GitLab rate limited::$(wc -l < "$report") GitLab end to end tests were skipped, see the run summary"
            {
              echo "### GitLab rate limited the end to end run"
              echo
              sed 's/^/- /' "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Submit to Chrome Extension Store
        working-directory: dist
        run: pnpm dlx chrome-webstore-upload-cli@3 upload --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
